name: Build EDFS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Buildozer image
        run: |
          cat > Dockerfile.edfs <<'EOF'
          FROM kivy/buildozer:latest

          USER root

          RUN apt-get update && \
              apt-get install -y \
                autoconf \
                automake \
                autopoint \
                gettext \
                libtool \
                pkg-config && \
              rm -rf /var/lib/apt/lists/*
          EOF

          docker build \
            -f Dockerfile.edfs \
            -t edfs-buildozer:latest \
            .

      - name: Build APK
        run: |
          docker run --rm \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -v "${{ github.workspace }}:/home/buildozer" \
            -w /home/buildozer \
            --entrypoint /bin/bash \
            edfs-buildozer:latest \
            -c "buildozer android debug"

      - name: Find APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDFS-APK
          path: bin/*.apk
          if-no-files-found: error
