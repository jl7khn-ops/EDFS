name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK using Buildozer (official Docker image)
        run: |
          docker run --rm -e BUILDOZER_WARN_ON_ROOT=0 \
            -v ${{ github.workspace }}:/home/buildozer \
            -w /home/buildozer \
            kivy/buildozer:latest android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
